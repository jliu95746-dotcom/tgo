global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/wecom.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["tgo-alertmanager:9093"]

scrape_configs:
  - job_name: tgo-platform-wecom
    metrics_path: /internal/metrics/durable
    scrape_timeout: 15s
    static_configs:
      - targets: ["tgo-platform:8003"]
    http_headers:
      X-SaaS-Service-Token:
        files: ["/run/secrets/saas-internal-token"]
