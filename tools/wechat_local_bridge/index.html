<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微信本机接入验证</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#f4f7f9;color:#18332a;margin:0}main{max-width:980px;margin:36px auto;padding:0 24px}h1{font-size:28px}.card{background:white;border:1px solid #dbe5df;border-radius:12px;padding:22px;margin:16px 0}.tag{color:#176c45;background:#e4f5eb;padding:6px 12px;border-radius:20px}.grid{display:flex;gap:24px;flex-wrap:wrap}textarea{box-sizing:border-box;width:100%;min-height:100px;padding:12px;border:1px solid #b3c9bc;border-radius:8px;font:inherit}button{border:0;border-radius:7px;padding:10px 16px;background:#167c4c;color:white;font:inherit;cursor:pointer}button.secondary{background:#edf0ee;color:#444}#history{padding:0;list-style:none}#history li{border-bottom:1px solid #e9eeeb;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:#66766c;font-size:14px}.error{color:#b23434}code{background:#f0f4f1;padding:2px 5px}</style></head>
<body><main><h1>微信本机接入验证</h1><span id="mode" class="tag">文件传输助手 · 只填写，不发送</span>
<section class="card"><div class="grid"><strong id="keys">正在检查密钥</strong><strong id="history-count"></strong><strong id="watch"></strong></div><p id="error" class="error"></p><p>请从手机向文件传输助手发送：<code id="test-prefix"></code></p><p class="hint">本页展示当前电脑已同步的记录；仅本轮选择的会话生成草稿。</p></section>
<section class="card"><h2>客服系统联调</h2><p id="tgo-status">当前是独立微信验证模式</p><p class="hint" id="tgo-detail"></p></section>
<section class="card"><h2>回复草稿</h2><textarea id="reply" readonly placeholder="等待收到新的测试消息"></textarea><p class="hint" id="reply-mode">收到消息后由 RPA 填写到微信输入框并保留为草稿。</p><button id="verify">查看核验结果</button> <button id="stop" class="secondary">停止监听</button><p id="result"></p></section>
<section class="card"><h2>窗口适配验收</h2><p id="automation">尚无窗口适配验收记录</p><p class="hint">当前采用恢复微信到前台后填写。已有草稿会保留；锁屏、定位失败或输入焦点变化时停止操作。</p></section>
<section class="card"><h2>最近聊天记录</h2><ul id="history"></ul></section></main><script src="/app.js"></script></body></html>
