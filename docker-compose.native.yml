services:
  postgres:
    ports: !override
      - "${NATIVE_POSTGRES_PORT:-15432}:5432"

  wukongim:
    environment:
      WK_WEBHOOK_HTTPADDR: ${WUKONGIM_WEBHOOK_URL:-http://host.docker.internal:18001/internal/integrations/wukongim/webhook}
    ports: !override
      - "127.0.0.1:5001:5001"
      - "5200:5200"
